name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          check-latest: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Assert repository npm version and path
        run: |
          test -f ./node_modules/npm/bin/npm-cli.js
          test "$(node ./node_modules/npm/bin/npm-cli.js --version)" = "11.14.1"

      - name: Fetch and verify immutable source binding
        shell: bash
        run: |
          git fetch --force origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          bun scripts/check-release-source.ts --tag "$GITHUB_REF_NAME"

      - name: Check release metadata and tag
        run: bun run release:check -- --tag "$GITHUB_REF_NAME"

      - name: Check repository contract
        run: bun run check:repo

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Create one npm candidate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-pack" "$RUNNER_TEMP/release-artifact"
          node ./node_modules/npm/bin/npm-cli.js pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm-pack" > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/npm-pack.json", "utf8")); if (value.length !== 1 || typeof value[0].filename !== "string") throw new Error("npm pack did not create one candidate"); fs.copyFileSync(process.env.RUNNER_TEMP + "/npm-pack/" + value[0].filename, process.env.RUNNER_TEMP + "/release-artifact/candidate.tgz");'

      - name: Create and verify canonical release manifest
        run: |
          bun scripts/create-release-manifest.ts --tag "$GITHUB_REF_NAME" --artifact "$RUNNER_TEMP/release-artifact/candidate.tgz" --output "$RUNNER_TEMP/release-artifact/release-manifest.json"
          bun scripts/verify-release-manifest.ts --tag "$GITHUB_REF_NAME" --manifest "$RUNNER_TEMP/release-artifact/release-manifest.json" --artifact "$RUNNER_TEMP/release-artifact/candidate.tgz"

      - name: Inspect candidate package
        run: bun scripts/check-package.ts "$RUNNER_TEMP/release-artifact/candidate.tgz"

      - name: Upload release candidate and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: |
            ${{ runner.temp }}/release-artifact/candidate.tgz
            ${{ runner.temp }}/release-artifact/release-manifest.json
          if-no-files-found: error

  publish:
    needs: validation
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release candidate and manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-artifact

      - name: Check out tag with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          check-latest: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Assert repository npm version and path
        run: |
          test -f ./node_modules/npm/bin/npm-cli.js
          test "$(node ./node_modules/npm/bin/npm-cli.js --version)" = "11.14.1"

      - name: Fetch and verify tag, HEAD, and origin/main
        shell: bash
        run: |
          git fetch --force origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          bun scripts/check-release-source.ts --tag "$GITHUB_REF_NAME" --manifest "$RUNNER_TEMP/release-artifact/release-manifest.json"

      - name: Verify manifest identity and candidate integrity
        run: bun scripts/verify-release-manifest.ts --tag "$GITHUB_REF_NAME" --manifest "$RUNNER_TEMP/release-artifact/release-manifest.json" --artifact "$RUNNER_TEMP/release-artifact/candidate.tgz"

      - name: Dry-run the exact candidate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-publish"
          cd "$RUNNER_TEMP/release-publish"
          node "$GITHUB_WORKSPACE/node_modules/npm/bin/npm-cli.js" publish "$RUNNER_TEMP/release-artifact/candidate.tgz" --dry-run --ignore-scripts --access public --provenance --registry https://registry.npmjs.org

      - name: Publish exact candidate with npm trusted publishing
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-publish"
          cd "$RUNNER_TEMP/release-publish"
          node "$GITHUB_WORKSPACE/node_modules/npm/bin/npm-cli.js" publish "$RUNNER_TEMP/release-artifact/candidate.tgz" --ignore-scripts --access public --provenance --registry https://registry.npmjs.org

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create notes-only GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Published @okazakee/precall $GITHUB_REF_NAME."
